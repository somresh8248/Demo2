<!DOCTYPE html>
<html>

<head>
    <title>Responsive PDF Header/Footer Tool</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f4f7fb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            padding: 45px 35px;
            border-radius: 28px;
            box-shadow:
                0 20px 50px rgba(15, 76, 129, 0.08),
                0 4px 12px rgba(0, 0, 0, 0.02);
            text-align: center;
            box-sizing: border-box;
        }

        .logo {
            width: 100%;
            max-width: 220px;
            height: auto;
            margin-bottom: 24px;
            object-fit: contain;
        }

        h2 {
            margin: 0 0 12px;
            color: #ab0ca3;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.4;
        }

        .info {
            font-size: 15px;
            color: #627d98;
            margin-bottom: 35px;
            line-height: 1.7;
        }

        /* Upload Box */
        .upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 40px 25px;
            border: 2px dashed #bac7d5;
            border-radius: 22px;
            background: #f8fafc;
            cursor: pointer;
            box-sizing: border-box;
            transition: 0.3s ease;
            margin-bottom: 28px;
        }

        .upload-label:hover {
            border-color: #ab0ca3;
            background: #f4f7ff;
            transform: translateY(-2px);
        }

        .upload-icon {
            width: 60px;
            height: 60px;
            background: #eef3ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .upload-icon svg {
            width: 28px;
            height: 28px;
            fill: #ab0ca3;
        }

        .upload-text {
            font-size: 18px;
            font-weight: 700;
            color: #34495e;
            margin: 0;
        }

        .upload-subtext {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 8px;
        }

        input[type="file"] {
            display: none;
        }

        /* Button */
        button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #ab0ca3, #7f0a79);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 10px 25px rgba(171, 12, 163, 0.25);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(171, 12, 163, 0.35);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Mobile Responsive */
        @media screen and (max-width: 768px) {

            body {
                padding: 18px;
            }

            .container {
                max-width: 100%;
                padding: 50px 35px;
                border-radius: 32px;
            }

            .logo {
                max-width: 180px;
            }

            h2 {
                font-size: 34px;
            }

            .info {
                font-size: 16px;
            }

            .upload-label {
                padding: 35px 20px;
            }

            .upload-text {
                font-size: 20px;
            }

            button {
                padding: 22px;
                font-size: 20px;
            }
        }

        @media screen and (max-width: 480px) {

            .container {
                padding: 45px 28px;
            }

            .logo {
                max-width: 160px;
            }

            h2 {
                font-size: 28px;
            }

            .upload-text {
                font-size: 18px;
            }

            button {
                padding: 20px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="lifecare.png" alt="Lifecare Logo" class="logo">

        <h2>Lifecare Diagnostic Centre</h2>

        <div class="info">
            Upload your PDF report to automatically add Lifecare Header & Footer professionally.
        </div>

        <!-- Upload Area -->
        <label for="pdfUpload" class="upload-label">

            <div class="upload-icon">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
                </svg>
            </div>

            <p class="upload-text" id="file-name-text">
                Choose PDF File
            </p>

            <p class="upload-subtext" id="file-size-text">
                Drag & Drop PDF Here
            </p>

        </label>

        <input type="file" id="pdfUpload" accept=".pdf" onchange="updateFileInputLabel()">

        <button onclick="processPDF()">
            Download Updated PDF
        </button>

    </div>

    <script>

        function updateFileInputLabel() {

            const fileInput = document.getElementById('pdfUpload');
            const nameDisplay = document.getElementById('file-name-text');
            const sizeDisplay = document.getElementById('file-size-text');

            if (fileInput.files.length > 0) {

                const selectedFile = fileInput.files[0];

                nameDisplay.textContent = selectedFile.name;

                const sizeInMB =
                    (selectedFile.size / (1024 * 1024)).toFixed(2);

                sizeDisplay.textContent =
                    `${sizeInMB} MB • Ready to Process`;

            } else {

                nameDisplay.textContent = "Choose PDF File";

                sizeDisplay.textContent = "Drag & Drop PDF Here";
            }
        }

        // Auto Detect Image Format
        async function loadAssetSafe(pdfDoc, baseName) {

            const extensions = [
                '.png',
                '.PNG',
                '.jpeg',
                '.JPEG',
                '.jpg',
                '.JPG'
            ];

            for (const ext of extensions) {

                try {

                    const response =
                        await fetch(baseName + ext);

                    if (!response.ok) continue;

                    const bytes =
                        await response.arrayBuffer();

                    if (ext.toLowerCase() === '.png') {

                        return await pdfDoc.embedPng(bytes);

                    } else {

                        return await pdfDoc.embedJpg(bytes);
                    }

                } catch (e) { }
            }

            throw new Error(
                `${baseName} image not found`
            );
        }

      async function processPDF() {

    try {

        const fileInput =
            document.getElementById('pdfUpload');

        if (!fileInput.files.length) {

            alert("Please upload PDF first");
            return;
        }

        const file = fileInput.files[0];

        const arrayBuffer =
            await file.arrayBuffer();

        const pdfDoc =
            await PDFLib.PDFDocument.load(arrayBuffer);

        const pages = pdfDoc.getPages();

        const newPdf =
            await PDFLib.PDFDocument.create();

        // Header Loader
        let headerImage;

        try {

            headerImage =
                await loadAssetSafe(newPdf, 'header');

        } catch (e) {

            headerImage =
                await loadAssetSafe(newPdf, 'Header');
        }

        // Footer Loader
        let footerImage;

        try {

            footerImage =
                await loadAssetSafe(newPdf, 'footer');

        } catch (e) {

            footerImage =
                await loadAssetSafe(newPdf, 'Footer');
        }

        for (let i = 0; i < pages.length; i++) {

            const oldPage = pages[i];

            const { width, height } =
                oldPage.getSize();

            // RESPONSIVE HEADER/FOOTER HEIGHT
            const headerFooterHeight =
                Math.max(width * 0.065, 55);

            const newPage =
                newPdf.addPage([width, height]);

            const embeddedPage =
                await newPdf.embedPage(oldPage);

            // MAIN CONTENT
            newPage.drawPage(embeddedPage, {

                x: 0,

                y: 25,

                width: width,

                height: height
            });

            // HEADER (KEEP ASPECT RATIO)
            newPage.drawImage(headerImage, {

                x: 0,

                y: height - headerFooterHeight,

                width: width,

                height: headerFooterHeight
            });

            // FOOTER (KEEP ASPECT RATIO)
            newPage.drawImage(footerImage, {

                x: 0,

                y: 0,

                width: width,

                height: headerFooterHeight
            });

            // PAGE NUMBER
            newPage.drawText(`Page ${i + 1}`, {

                x: width - 70,

                y: 20,

                size: 9,

                color:
                    PDFLib.rgb(0.3, 0.3, 0.3)
            });
        }

        // SAVE PDF
        const pdfBytes = await newPdf.save();

        const blob = new Blob(
            [pdfBytes],
            { type: "application/pdf" }
        );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        const originalFileName =
            file.name.replace('.pdf', '');

        a.download =
            originalFileName + '_updated.pdf';

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

    } catch (error) {

        console.error(error);

        alert(
            "Error processing PDF: " +
            error.message
        );
    }
}
    </script>

</body>

</html>
