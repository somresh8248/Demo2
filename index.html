<!DOCTYPE html>
<html>

<head>
    <title>PDF Header Footer Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: radial-gradient(circle at top right, #f4f8fc 0%, #e5eef9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 45px 35px;
            border-radius: 28px;
            box-shadow:
                0 20px 50px rgba(15, 76, 129, 0.08),
                0 4px 12px rgba(0, 0, 0, 0.02);
            text-align: center;
            box-sizing: border-box;
            border: 1px solid rgba(229, 238, 249, 0.8);
        }

        .logo {
            width: 100%;
            max-width: 200px;
            height: auto;
            margin-bottom: 24px;
            object-fit: contain;
        }

        h2 {
            margin: 0 0 12px;
            color: #ab0ca3;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .info {
            font-size: 14px;
            color: #627d98;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* CUSTOM FILE UPLOAD BLOCK */
        .upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 32px 20px;
            border: 2px dashed #bac7d5;
            border-radius: 18px;
            background: #f8fafc;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.25s ease;
            margin-bottom: 24px;
        }

        .upload-label:hover {
            border-color: #1d70b8;
            background: #f0f5fa;
            transform: translateY(-1px);
        }

        .upload-icon {
            width: 42px;
            height: 42px;
            background: #e6effa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            transition: background 0.25s ease;
        }

        .upload-label:hover .upload-icon {
            background: #1d70b8;
        }

        .upload-icon svg {
            width: 20px;
            height: 20px;
            fill: #1d70b8;
            transition: fill 0.25s ease;
        }

        .upload-label:hover .upload-icon svg {
            fill: #ffffff;
        }

        .upload-text {
            font-size: 14px;
            font-weight: 600;
            color: #486581;
            margin: 0;
        }

        .upload-subtext {
            font-size: 12px;
            color: #829ab1;
            margin: 4px 0 0;
        }

        input[type="file"] {
            display: none;
        }

        /* BUTTON ACTION */
        button {
            width: 100%;
            padding: 16px;
            background: #ab0ca3;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(15, 76, 129, 0.2);
        }

        button:hover {
            background: #1d70b8;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(29, 112, 184, 0.3);
        }

        button:active {
            transform: scale(0.99);
        }

        /* RESPONSIVE LAYOUT CONFIGURATIONS */
        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .container {
                max-width: 100%;
                padding: 35px 24px;
                border-radius: 24px;
            }

            h2 {
                font-size: 21px;
            }

            .info {
                font-size: 13px;
                margin-bottom: 24px;
            }

            .upload-label {
                padding: 24px 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="lifecare.png" alt="Lifecare Logo" class="logo">

        <h2>Lifecare Diagnostic Centre</h2>
        
        <div class="info">
            Upload a local document to systematically attach authentic Lifecare header and footer imagery configurations.
        </div>

        <label for="pdfUpload" class="upload-label">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                </svg>
            </div>
            <p class="upload-text" id="file-name-text">Choose PDF File</p>
            <p class="upload-subtext" id="file-size-text">or drag and drop here</p>
        </label>
        
        <input type="file" id="pdfUpload" accept=".pdf" onchange="updateFileInputLabel()">

        <button onclick="processPDF()">Download Updated PDF</button>
    </div>

    <script>
        function updateFileInputLabel() {
            const fileInput = document.getElementById('pdfUpload');
            const nameDisplay = document.getElementById('file-name-text');
            const sizeDisplay = document.getElementById('file-size-text');
            
            if (fileInput.files.length > 0) {
                const selectedFile = fileInput.files[0];
                nameDisplay.textContent = selectedFile.name;
                nameDisplay.style.color = "#0f4c81";
                
                const sizeInMB = (selectedFile.size / (1024 * 1024)).toFixed(2);
                sizeDisplay.textContent = `${sizeInMB} MB - Ready to Process`;
            } else {
                nameDisplay.textContent = "Choose PDF File";
                nameDisplay.style.color = "#486581";
                sizeDisplay.textContent = "or drag and drop here";
            }
        }

        async function processPDF() {
            try {
                const fileInput = document.getElementById('pdfUpload');

                if (!fileInput.files.length) {
                    alert("Upload PDF first");
                    return;
                }

                const file = fileInput.files[0];
                const arrayBuffer = await file.arrayBuffer();

                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                const pages = pdfDoc.getPages();

                const newPdf = await PDFLib.PDFDocument.create();

                const headerBytes = await fetch('Header.png').then(res => res.arrayBuffer());
                const headerImage = await newPdf.embedPng(headerBytes);

                const footerBytes = await fetch('footer.png').then(res => res.arrayBuffer());
                const footerImage = await newPdf.embedPng(footerBytes);

                for (let i = 0; i < pages.length; i++) {
                    const oldPage = pages[i];
                    const { width, height } = oldPage.getSize();

                    // Calculate perfect height based on asset aspect ratio (595:100)
                    const assetAspectRatio = 100 / 595;
                    const computedImageHeight = width * assetAspectRatio;

                    // Re-instantiate the same workspace boundaries
                    const newPage = newPdf.addPage([width, height]);
                    const embeddedPage = await newPdf.embedPage(oldPage);

                    // Draw the core document page under the header and above the footer
                    newPage.drawPage(embeddedPage, {
                        x: 0,
                        y: 0,
                        width: width,
                        height: height
                    });

                    // Draw Header flushed to the top edge
                    newPage.drawImage(headerImage, {
                        x: 0,
                        y: height - computedImageHeight,
                        width: width,
                        height: computedImageHeight
                    });

                    // Draw Footer flushed to the bottom edge
                    newPage.drawImage(footerImage, {
                        x: 0,
                        y: 0,
                        width: width,
                        height: computedImageHeight
                    });

                    // Adjust page numbers elegantly over the right side edge
                    newPage.drawText(`Page ${i + 1}`, {
                        x: width - 75,
                        y: computedImageHeight + 15,
                        size: 9,
                        color: PDFLib.rgb(0.3, 0.3, 0.3)
                    });
                }
                
                const pdfBytes = await newPdf.save();
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const url = URL.createObjectURL(blob);

                const a = document.createElement("a");
                a.href = url;
                const originalFileName = file.name.replace('.pdf', '');
                a.download = originalFileName + '_updated.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

            } catch (error) {
                console.error(error);
                alert("Error processing PDF: " + error.message);
            }
        }
    </script>
</body>

</html>
